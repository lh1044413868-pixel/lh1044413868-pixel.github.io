<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WCW点单">
<title>Wei Chong Wei 点单</title>
<style>
:root{--bg:#F3F1EC;--card:#FFFFFF;--ink:#151A17;--mute:#5B625D;--line:#DDD8CC;--g:#1F5E3B;--r:#B42318;--soft:#E7F1EA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
button{cursor:pointer;border:0;background:none;padding:0}
.top{display:flex;align-items:center;padding:10px 16px;background:var(--g);color:#fff;height:64px}
.top>*{margin-right:12px}
.top>*:last-child{margin-right:0}
.top h1{margin:0 12px 0 0;font-size:22px;font-weight:700;letter-spacing:.02em}
.top .no{font-weight:700;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:6px}
.top .sp{flex:1}
.top input{width:240px;max-width:100%;height:44px;border-radius:8px;border:0;padding:0 12px;font-size:16px;color:#151A17;background:#fff}
.tbtn{height:44px;padding:0 14px;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.app{display:-webkit-box;display:flex;height:calc(100vh - 64px);min-height:520px}
.cats{width:150px;flex:none;overflow-y:auto;-webkit-overflow-scrolling:touch;border-right:1px solid var(--line);background:var(--card)}
.cats button{display:block;width:100%;text-align:left;padding:12px 14px;min-height:48px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
.cats button.on{background:var(--g);color:#fff}
.cats small{display:block;font-size:13px;font-weight:400;opacity:.8}
.dishes{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.dishes h2{margin:4px 0 10px;font-size:20px;color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));grid-gap:10px}
.dish{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:84px;text-align:left;display:flex;flex-direction:column}
.dish:active{background:var(--soft)}
.dish b{font-size:17px;font-weight:600;line-height:1.2}
.dish i{font-size:14px;color:var(--mute);font-style:normal;margin-top:2px}
.dish em{margin-top:auto;padding-top:4px;font-weight:700;font-size:15px;color:var(--g);font-style:normal}
.hot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--r);margin-left:5px;vertical-align:middle}
.ticket{width:340px;flex:none;display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--line)}
.thead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex}
.thead input{flex:1;width:50%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg)}
.thead input+input{margin-left:8px}
.lines{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.ln{padding:10px 0;border-bottom:1px dashed var(--line)}
.ln .r1{display:flex;align-items:baseline}
.ln .nm{flex:1;font-weight:700;font-size:17px;margin-right:8px}
.ln .opt{font-size:14px;color:var(--g);font-weight:500}
.ln .en{font-size:13px;font-weight:400;color:var(--mute)}
.ln .amt{font-weight:700;font-size:18px;white-space:nowrap}
.ln .r2{display:flex;align-items:center;margin-top:6px}
.ln .r2>*{margin-right:6px}
.ln .r2>*:last-child{margin-right:0}
.q{width:44px;height:44px;border-radius:8px;background:var(--soft);font-size:22px;font-weight:700;color:var(--g)}
.qn{min-width:30px;text-align:center;font-weight:700;font-size:18px}
.note{flex:1;width:60px;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);font-size:15px}
.tot{padding:12px 14px;border-top:2px solid var(--line)}
.tot>*{margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.row.big{font-weight:700;font-size:30px}
.tax{display:flex;align-items:center;font-size:15px;color:var(--mute)}
.tax>*{margin-right:8px}
.tax>*:last-child{margin-right:0}
.tax input[type=checkbox]{width:22px;height:22px;-webkit-appearance:checkbox;appearance:checkbox}
.tax input[type=number]{width:64px;height:36px;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--bg)}
.acts{display:flex;flex-wrap:wrap;margin:4px -4px 0}
.btn{min-height:52px;border-radius:10px;font-weight:700;font-size:18px;flex:1 1 40%;margin:4px}
.btn.pri{background:var(--r);color:#fff;flex-basis:100%}
.btn.sec{background:var(--soft);color:var(--g)}
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.sheet.on{display:flex}
.box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch}
.box h3{margin:0 0 2px;font-size:22px}
.box p{margin:0 0 14px;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));grid-gap:10px}
.opts button{min-height:64px;border-radius:10px;border:2px solid var(--line);background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-weight:600;font-size:17px;text-align:left}
.opts button b{font-weight:700;font-size:20px;color:var(--g);margin-left:8px}
.close{margin-top:14px;width:100%;min-height:48px;border-radius:10px;background:var(--soft);font-weight:600}
pre.rc{background:#fff;color:#111;font:600 16px/1.45 Menlo,Courier,monospace;padding:16px;border-radius:8px;white-space:pre-wrap;border:1px solid #ccc;margin:0 0 12px;-webkit-user-select:text;user-select:text}
.hist{font-size:15px}
.hist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:20px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;-webkit-transition:opacity .2s;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.on{opacity:1}
#printArea{display:none}
@media (max-width:900px){.app{display:block;height:auto}.cats{width:auto;display:flex;overflow-x:auto;border-right:0}.cats button{flex:none;width:auto;border-bottom:0;border-right:1px solid var(--line)}.ticket{width:auto;border-left:0;border-top:2px solid var(--line)}.lines{max-height:none}.top input{width:150px}}
@media print{body>*{display:none!important}#printArea{display:block!important;font:600 13px/1.4 Menlo,Courier,monospace;white-space:pre-wrap;color:#000}}
</style>
</head>
<body>
<header class="top">
<h1>WEI CHONG WEI 点单</h1>
<span class="no" id="no">#1</span>
<span class="sp"></span>
<input id="q" type="search" placeholder="搜菜名 Search…" aria-label="搜菜名">
<button class="tbtn" id="histBtn">今日单子</button>
</header>
<main class="app">
<nav class="cats" id="cats" aria-label="分类"></nav>
<section class="dishes" id="dishes"></section>
<aside class="ticket">
<div class="thead"><input id="cust" placeholder="客人名字 Name" autocomplete="off"><input id="phone" type="tel" placeholder="电话 Phone" autocomplete="off"></div>
<div class="lines" id="lines"></div>
<div class="tot">
<div class="row"><span>小计 Subtotal</span><span id="sub">$0.00</span></div>
<label class="tax"><input type="checkbox" id="taxOn"><span>加税 Tax</span><input type="number" id="taxRate" step="0.1" min="0" value="8"><span>%</span><span style="flex:1"></span><span id="taxAmt">$0.00</span></label>
<div class="row big"><span>总共</span><span id="total">$0.00</span></div>
<div class="acts">
<button class="btn pri" id="done">完成这单 · 出小票</button>
<button class="btn sec" id="undo">撤回上一样</button>
<button class="btn sec" id="clear">清空</button>
</div>
</div>
</aside>
</main>
<div class="sheet" id="optSheet"><div class="box"><h3 id="optT"></h3><p id="optE"></p><div class="opts" id="opts"></div><button class="close" data-close="1">取消</button></div></div>
<div class="sheet" id="rcSheet"><div class="box"><pre class="rc" id="rc"></pre><div class="acts"><button class="btn sec" id="print">打印小票</button><button class="btn sec" id="copy">复制小票</button><button class="btn pri" id="next">下一单</button></div><button class="close" data-close="1">返回修改</button></div></div>
<div class="sheet" id="hSheet"><div class="box"><h3>今日单子</h3><p id="hSum"></p><div class="hist" id="hList"></div><button class="close" id="hClear" style="background:none;color:var(--r)">清除今日记录</button><button class="close" data-close="1">关闭</button></div></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

ream","zh":"冰淇淋","hot":0,"o":[{"l":"杯 Cup","p":3.5},{"l":"半品脱 Half Pint","p":4.75},{"l":"品脱 Pint","p":6},{"l":"夸脱 Quart","p":8.5}]},{"en":"Mix Flavors (add)","zh":"混口味（加）","o":[{"l":"","p":0.25}],"hot":0},{"en":"Big Cheese Soft Pretzel","zh":"芝士软饼","o":[{"l":"","p":2.5}],"hot":0},{"en":"Funnel Cake","zh":"漏斗蛋糕","o":[{"l":"","p":2}],"hot":0},{"en":"Funnel Cake Fries","zh":"漏斗蛋糕条","o":[{"l":"","p":3}],"hot":0},{"en":"Twix or Snickers Ice Cream Bar","zh":"Twix / Snickers 雪糕","o":[{"l":"","p":2.5}],"hot":0},{"en":"Jack & Jill Bars & Nut Cone","zh":"Jack & Jill 雪糕 / 甜筒","o":[{"l":"","p":1.99}],"hot":0},{"en":"Rainbow Popsicle","zh":"彩虹冰棒","o":[{"l":"","p":1.95}],"hot":0}]}]</script>
<script>
(function(){
"use strict";
var M=JSON.parse(document.getElementById('menu').textContent);
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+n.toFixed(2)}
function findCat(id){for(var i=0;i<M.length;i++)if(M[i].id===id)return M[i];return M[0]}
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function todayStr(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function timeStr(){var d=new Date(),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2),ap=h<12?'AM':'PM';h=h%12||12;return h+':'+m+' '+ap}
var today=todayStr();
var day=store.get('wcw-day',{date:today,no:1,orders:[]});
if(day.date!==today)day={date:today,no:1,orders:[]};
var order=store.get('wcw-draft',[]);
var cat=M[0].id,q='';
var tax=store.get('wcw-tax',{on:false,rate:8});
$('taxOn').checked=tax.on;$('taxRate').value=tax.rate;

function priceRange(it){var a=Infinity,b=-Infinity;it.o.forEach(function(o){if(o.p<a)a=o.p;if(o.p>b)b=o.p});return a===b?money(a):money(a)+' – '+money(b)}
function drawCats(){$('cats').innerHTML=M.map(function(c){return '<button data-c="'+c.id+'" class="'+(c.id===cat&&!q?'on':'')+'">'+esc(c.en)+'<small>'+esc(c.zh)+'</small></button>'}).join('')}
function dishBtn(c,i){var it=c.items[i];return '<button class="dish" data-c="'+c.id+'" data-i="'+i+'"><b>'+esc(it.en)+(it.hot?'<span class="hot"></span>':'')+'</b><i>'+esc(it.zh)+'</i><em>'+priceRange(it)+'</em></button>'}
function drawDishes(){
 var h='';
 if(q){var t=q.toLowerCase();M.forEach(function(c){c.items.forEach(function(it,i){if((it.zh+' '+it.en).toLowerCase().indexOf(t)>=0)h+=dishBtn(c,i)})});
  $('dishes').innerHTML='<h2>搜索：'+esc(q)+'</h2><div class="grid">'+(h||'<p class="empty">没找到</p>')+'</div>';return}
 var c=findCat(cat);
 for(var i=0;i<c.items.length;i++)h+=dishBtn(c,i);
 $('dishes').innerHTML='<h2>'+esc(c.en)+' · '+esc(c.zh)+'</h2><div class="grid">'+h+'</div>'}
function save(){store.set('wcw-draft',order)}
function totals(){var sub=0;order.forEach(function(l){sub+=l.p*l.n});var on=$('taxOn').checked;var rate=parseFloat($('taxRate').value)||0;var tx=on?Math.round(sub*rate)/100:0;return {sub:sub,tx:tx,tot:sub+tx,on:on,rate:rate}}
function drawOrder(){
 $('no').textContent='#'+day.no;
 $('lines').innerHTML=order.length?order.map(function(l,k){return '<div class="ln"><div class="r1"><span class="nm">'+esc(l.en)+' '+(l.opt?'<span class="opt">'+esc(l.opt)+'</span>':'')+'<div class="en">'+esc(l.zh)+' · '+money(l.p)+'</div></span><span class="amt">'+money(l.p*l.n)+'</span></div><div class="r2"><button class="q" data-m="'+k+'">−</button><span class="qn">'+l.n+'</span><button class="q" data-p="'+k+'">+</button><input class="note" data-k="'+k+'" value="'+esc(l.note||'')+'" placeholder="备注：不要葱、加辣…"></div></div>'}).join(''):'<p class="empty">点左边的菜加进来</p>';
 var t=totals();$('sub').textContent=money(t.sub);$('taxAmt').textContent=money(t.tx);$('total').textContent=money(t.tot)}
function add(c,i,o){var it=findCat(c).items[i];var op=it.o[o];var opt=op.l;var ex=null;
 order.forEach(function(l){if(!ex&&l.en===it.en&&l.opt===opt&&!l.note)ex=l});
 if(ex)ex.n++;else order.push({en:it.en,zh:it.zh,opt:opt,p:op.p,n:1,note:''});save();drawOrder();toast('Added '+it.en+(opt?' · '+opt:''))}
var tt;function toast(m){$('toast').textContent=m;$('toast').className='toast on';clearTimeout(tt);tt=setTimeout(function(){$('toast').className='toast'},1200)}
function openSheet(id){$(id).className='sheet on'}
function closeSheets(){var s=document.querySelectorAll('.sheet');for(var i=0;i<s.length;i++)s[i].className='sheet'}
function wlen(s){var n=0;for(var i=0;i<s.length;i++)n+=/[　-鿿＀-￯]/.test(s.charAt(i))?2:1;return n}
function rep(ch,n){var s='';for(var i=0;i<n;i++)s+=ch;return s}
function pad(a,b,w){a=String(a);b=String(b);var sp=w-wlen(a)-wlen(b);return a+rep(' ',Math.max(1,sp))+b}
function receipt(){var t=totals(),W=32;var L=['      WEI CHONG WEI','  1450 S 52nd St, Philadelphia',rep('-',W),pad('单号 #'+day.no,timeStr(),W)];
 var cu=$('cust').value.trim(),ph=$('phone').value.trim();
 if(cu)L.push('客人 Name: '+cu);if(ph)L.push('电话 Phone: '+ph);L.push(rep('-',W));
 order.forEach(function(l){L.push(pad(l.n+' x '+l.en,money(l.p*l.n),W));L.push('    '+(l.zh||'')+(l.opt?' ['+l.opt+']':''));if(l.note)L.push('    ** '+l.note)});
 L.push(rep('-',W),pad('小计 Subtotal',money(t.sub),W));if(t.on)L.push(pad('税 Tax '+t.rate+'%',money(t.tx),W));L.push(pad('总共 TOTAL',money(t.tot),W),rep('-',W),'        Thank you! 谢谢');return L.join('\n')}
function closestBtn(el){while(el&&el!==document){if(el.tagName==='BUTTON')return el;el=el.parentNode}return null}
document.addEventListener('click',function(e){
 var b=closestBtn(e.target);if(!b)return;
 var d=function(k){return b.getAttribute('data-'+k)};
 if(d('close')!==null){closeSheets();return}
 if(b.parentNode.id==='cats'){cat=d('c');q='';$('q').value='';drawCats();drawDishes();$('dishes').scrollTop=0;window.scrollTo(0,0);return}
 if(b.className.indexOf('dish')>=0){var c=d('c'),i=+d('i');var it=findCat(c).items[i];
  if(it.o.length===1){add(c,i,0);return}
  $('optT').textContent=it.en;$('optE').textContent=it.zh;
  $('opts').innerHTML=it.o.map(function(o,k){return '<button data-oc="'+c+'" data-oi="'+i+'" data-ok="'+k+'"><span>'+esc(o.l)+'</span><b>'+money(o.p)+'</b></button>'}).join('');openSheet('optSheet');return}
 if(d('ok')!==null){add(d('oc'),+d('oi'),+d('ok'));closeSheets();return}
 if(d('p')!==null){order[+d('p')].n++;save();drawOrder();return}
 if(d('m')!==null){var k=+d('m'),l=order[k];l.n--;if(l.n<1)order.splice(k,1);save();drawOrder();return}
});
$('lines').addEventListener('input',function(e){var k=e.target.getAttribute('data-k');if(k!==null){order[+k].note=e.target.value;save()}});
$('phone').addEventListener('input',function(e){var d=e.target.value.replace(/\D/g,'').slice(0,10);e.target.value=d.length>6?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):d.length>3?'('+d.slice(0,3)+') '+d.slice(3):d});
$('q').addEventListener('input',function(e){q=e.target.value.trim();drawCats();drawDishes()});
function taxChanged(){store.set('wcw-tax',{on:$('taxOn').checked,rate:parseFloat($('taxRate').value)||0});drawOrder()}
$('taxOn').addEventListener('change',taxChanged);$('taxRate').addEventListener('input',taxChanged);
$('undo').onclick=function(){if(!order.length)return;var l=order[order.length-1];l.n--;if(l.n<1)order.pop();save();drawOrder()};
var clearArm=0;$('clear').onclick=function(){if(!order.length)return;if(Date.now()-clearArm<2500){order=[];$('cust').value='';$('phone').value='';save();drawOrder();toast('已清空')}else{clearArm=Date.now();toast('再按一次「清空」确认')}};
$('done').onclick=function(){if(!order.length){toast('还没点菜');return}$('rc').textContent=receipt();openSheet('rcSheet')};
$('next').onclick=function(){var t=totals(),n=0;order.forEach(function(l){n+=l.n});day.orders.push({no:day.no,time:timeStr(),cust:$('cust').value.trim(),phone:$('phone').value.trim(),total:t.tot,items:n});day.no++;store.set('wcw-day',day);order=[];$('cust').value='';$('phone').value='';save();closeSheets();drawOrder();toast('已保存，开始下一单')};
$('print').onclick=function(){$('printArea').textContent=$('rc').textContent;window.print()};
$('copy').onclick=function(){var ta=document.createElement('textarea');ta.value=$('rc').textContent;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);
 var ok=false;try{var r=document.createRange();r.selectNodeContents(ta);var s=window.getSelection();s.removeAllRanges();s.addRange(r);ta.setSelectionRange(0,999999);ok=document.execCommand('copy')}catch(e){}
 document.body.removeChild(ta);toast(ok?'已复制':'复制不了，请长按小票选择复制')};
$('histBtn').onclick=function(){var sum=0;day.orders.forEach(function(o){sum+=o.total});$('hSum').textContent=day.date+' · '+day.orders.length+' 单 · 共 '+money(sum);
 $('hList').innerHTML=day.orders.length?day.orders.slice().reverse().map(function(o){return '<div><span>#'+o.no+' · '+esc(o.time)+(o.cust?' · '+esc(o.cust):'')+(o.phone?' · '+esc(o.phone):'')+' · '+o.items+' 样</span><b>'+money(o.total)+'</b></div>'}).join(''):'<p class="empty">今天还没有单子</p>';openSheet('hSheet')};
var hArm=0;$('hClear').onclick=function(){if(Date.now()-hArm<2500){day={date:today,no:1,orders:[]};store.set('wcw-day',day);closeSheets();drawOrder();toast('今日记录已清除')}else{hArm=Date.now();toast('再按一次确认清除')}};
var sh=document.querySelectorAll('.sheet');for(var i=0;i<sh.length;i++)sh[i].addEventListener('click',function(e){if(e.target===this)closeSheets()});
drawCats();drawDishes();drawOrder();
})();
</script>
